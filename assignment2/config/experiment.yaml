# Fixed experiment manifest for Assignment 2. Edit and commit this file before
# a pilot or final run; results store its effective values and fingerprint.
output_root: assignment2/results

agent:
  max_text_history: 6
  max_image_history: 0
  max_plan_words: 80
  max_subgoal_words: 32
  max_recent_observations: 3
  reflection_interval: 4
  max_reflection_lessons: 3

execution:
  client_max_retries: 2
  retry_delay_seconds: 2

# These are intentionally conservative guardrails, not a claim about a
# provider's live price. Verify current pricing and replace them before a run.
budget:
  # One persistent ledger covers every Gemini request across smoke, pilot,
  # final, retries, and Slurm resubmissions.
  total_ceiling_usd: 10.00
  max_input_tokens_per_call: 8192
  max_output_tokens_per_call: 384
  conservative_input_usd_per_million: 1.00
  conservative_output_usd_per_million: 4.00

models:
  gemini_flash_lite:
    client_name: gemini
    model_id: gemini-2.5-flash-lite
    hosting_method: gemini_developer_api
    temperature: 0.2
    max_output_tokens: 384
  qwen_7b_local:
    client_name: vllm
    model_id: Qwen/Qwen2.5-7B-Instruct
    base_url: http://127.0.0.1:8080/v1
    hosting_method: vllm_on_allocated_l40s
    temperature: 0.2
    max_output_tokens: 384

benchmarks:
  babyai:
    max_steps: 128
    # Development, pilot, and final lists are deliberately disjoint.
    episodes:
      smoke:
        - {task: BabyAI-MixedTrainLocal-v0/goto, seed: 101}
      development:
        - {task: BabyAI-MixedTrainLocal-v0/goto, seed: 1101}
        - {task: BabyAI-MixedTrainLocal-v0/pickup, seed: 1102}
        - {task: BabyAI-MixedTrainLocal-v0/open, seed: 1103}
      pilot:
        - {task: BabyAI-MixedTrainLocal-v0/goto, seed: 2101}
        - {task: BabyAI-MixedTrainLocal-v0/pickup, seed: 2102}
        - {task: BabyAI-MixedTrainLocal-v0/open, seed: 2103}
        - {task: BabyAI-MixedTrainLocal-v0/putnext, seed: 2104}
      final:
        - {task: BabyAI-MixedTrainLocal-v0/goto, seed: 3101}
        - {task: BabyAI-MixedTrainLocal-v0/pickup, seed: 3102}
        - {task: BabyAI-MixedTrainLocal-v0/open, seed: 3103}
        - {task: BabyAI-MixedTrainLocal-v0/putnext, seed: 3104}
        - {task: BabyAI-MixedTrainLocal-v0/pick_up_seq_go_to, seed: 3105}
        - {task: BabyAI-MixedTrainLocal-v0/goto, seed: 3106}
        - {task: BabyAI-MixedTrainLocal-v0/pickup, seed: 3107}
        - {task: BabyAI-MixedTrainLocal-v0/open, seed: 3108}
        - {task: BabyAI-MixedTrainLocal-v0/putnext, seed: 3109}
        - {task: BabyAI-MixedTrainLocal-v0/pick_up_seq_go_to, seed: 3110}
  crafter:
    max_steps: 1000
    episodes:
      smoke:
        - {task: default, seed: 401}
      development:
        - {task: default, seed: 1401}
        - {task: default, seed: 1402}
        - {task: default, seed: 1403}
      pilot:
        - {task: default, seed: 2401}
        - {task: default, seed: 2402}
        - {task: default, seed: 2403}
        - {task: default, seed: 2404}
      final:
        - {task: default, seed: 3401}
        - {task: default, seed: 3402}
        - {task: default, seed: 3403}
        - {task: default, seed: 3404}
        - {task: default, seed: 3405}
        - {task: default, seed: 3406}
        - {task: default, seed: 3407}
        - {task: default, seed: 3408}
        - {task: default, seed: 3409}
        - {task: default, seed: 3410}

phases:
  smoke:
    models: [gemini_flash_lite]
    agents: [naive, planning, reflective_planning]
    benchmarks: [babyai, crafter]
  development:
    models: [gemini_flash_lite, qwen_7b_local]
    agents: [naive, planning, reflective_planning]
    benchmarks: [babyai, crafter]
  pilot:
    models: [gemini_flash_lite, qwen_7b_local]
    agents: [naive, planning, reflective_planning]
    benchmarks: [babyai, crafter]
  final:
    models: [gemini_flash_lite, qwen_7b_local]
    agents: [naive, planning, reflective_planning]
    benchmarks: [babyai, crafter]
    # These runs quantify model sampling variability on one unchanged setting.
    # They are not independent task samples and are analysed separately.
    repeated_runs:
      - name: fixed_seed_variability
        models: [gemini_flash_lite, qwen_7b_local]
        agents: [naive, planning, reflective_planning]
        benchmark: babyai
        task: BabyAI-MixedTrainLocal-v0/goto
        seed: 3901
        repeats: 3
